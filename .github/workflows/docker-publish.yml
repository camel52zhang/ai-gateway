name: Docker Publish

# 触发条件：
#   - push 到 main 分支        → 跑测试 + 构建并推送 latest 与 commit SHA 短标签
#   - 打 vYY.MM.DD tag        → 额外推送日期版本标签（如 26.09.15），
#                               镜像内部版本号（启动横幅）= YY.MM.DD（去 v）
#   - 提 PR 到 main            → 仅跑测试，不推送镜像
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1) 单元测试：确保合并/发布前代码可编译且测试通过
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # 本项目使用纯 Go 版 SQLite，需关闭 CGO 以静态链接
      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  # ---------------------------------------------------------------
  # 2) 构建并推送镜像：Docker Hub + GHCR（仅在非 PR 时执行）
  #    GHCR 使用仓库内置 GITHUB_TOKEN，无需任何 secret；镜像出现在
  #    https://github.com/camel52zhang/ai-gateway/pkgs/container/
  # ---------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR 认证用的是工作流自身的临时 GITHUB_TOKEN，随 job 结束失效
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 计算内部版本号（启动横幅用）：
      #   - tag push (vYY.MM.DD) → YY.MM.DD（去掉 v 前缀）
      #   - 分支 push            → commit 短哈希
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 根据触发条件生成镜像标签：
      #   - main 分支          → latest
      #   - 任意 push          → sha-<短哈希>
      #   - vYY.MM.DD tag      → 26.09.15 这样的日期版本
      # 注意：不能用 type=semver —— 它按 SemVer 规范归一化，会把
      # v26.09.15 变成 26.9.15（抹掉前导零）；type=match 用正则捕获组
      # 原样保留 YY.MM.DD 格式。
      # images 同时列出两个 registry：同一份 tags 会分别应用到
      # Docker Hub 与 GHCR，一次构建双处推送（免重复构建缓存）。
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-gateway
            ghcr.io/camel52zhang/ai-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=v(\d{2}\.\d{2}\.\d{2}),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 注入版本号，供启动横幅打印（.dockerignore 排除了 .git，构建期
          # 无法自行读取 VCS revision）。tag push 时 = YY.MM.DD。
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
