# AI Gateway —— 本地开发 Compose（从源码构建）
#
# 快速开始：
#   1. cp .env.example .env        # 按需修改宿主机端口 / 跨域来源
#   2. docker compose up -d --build
#   3. 浏览器打开 http://localhost:7000
#
# 要部署到 VPS / NAS（免构建、直接拉 CI 镜像）请改用：
#   docker compose -f vps-docker-compose.yml up -d
#
# 首次运行：容器内会生成 data/gateway.db，管理员用户名为 admin。
#          建议在 .env 里设置 ADMIN_PASSWORD，启动时即完成初始化；
#          若未设置，登录会被拒绝（默认不再接受"任意密码"），此时可用
#          `docker compose run --rm ai-gateway --reset-password` 生成随机密码。
#
# 忘记密码（三种方式，均不依赖短信/邮箱）：
#   1) docker compose run --rm ai-gateway --reset-password
#      —— 生成随机密码并打印，改完即退出，不影响正在运行的容器。
#   2) .env 设 ADMIN_PASSWORD=... 与 RESET_PASSWORD=1，重启一次，用完移除。
#   3) 登录页「忘记密码？用恢复码」——用设置页生成的离线恢复码自助重置。
#
# 数据持久化：宿主机目录 ./gateway-data 挂载到 /app/data，容器重建/升级不丢数据，
# 且 gateway.db 直接落在项目目录里，备份/迁移就是拷文件夹。
# 端口映射：宿主机 ${PORT:-7000} -> 容器 7000（容器内固定 7000）。
#
# 属主说明：镜像内 app 用户 uid:gid = 100:101。入口脚本在容器以 root 启动时
# 会自动 chown /app/data（含 bind mount），无需手动处理；Linux 上若以非 root
# 用户运行 compose（rootless），请先 chown -R 100:101 gateway-data。

services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # 启动横幅里显示的版本号。.dockerignore 排除了 .git，构建期读不到 VCS
      # revision，所以这里显式传；不传则为 "dev"。
      #   VERSION=$(git rev-parse --short HEAD) docker compose build
      args:
        VERSION: "${VERSION:-dev}"
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped

    # init: 由 Docker 注入一个轻量 init(PID 1)，负责回收僵尸进程并把
    # SIGTERM 正确转发给入口脚本 / 网关，配合程序的优雅关闭。
    init: true

    # 安全硬化：禁止容器内的进程通过 setuid/setgid 二进制或文件能力「获得」新权限。
    # 入口脚本以 root 启动、chown 后 su-exec 到 app 用户——那是「放弃」权限而非获取，
    # 不受此选项影响（已实测启动、健康检查、登录均正常）。
    security_opt:
      - no-new-privileges:true

    ports:
      - "${PORT:-7000}:7000"
    environment:
      PORT: "7000"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-}"
      # 首次启动时用该密码初始化 admin 账号（强烈建议设置）
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # 置 1 时，本次启动会把密码重置为 ADMIN_PASSWORD；未设置 ADMIN_PASSWORD
      # 则生成随机密码并打印到容器日志。用完请立即移除该变量。
      RESET_PASSWORD: "${RESET_PASSWORD:-0}"
      # ⚠️ 危险开关：置 1 时，首次运行（库中尚无密码）接受「任意密码」登录，
      # 恢复到旧的宽松行为。仅用于无法设置 ADMIN_PASSWORD 的受限场景；
      # 本地环境风险可控，公网环境切勿开启（见 vps-docker-compose.yml）。
      ALLOW_FIRST_RUN_ANY_PASSWORD: "${ALLOW_FIRST_RUN_ANY_PASSWORD:-0}"
      # 放在 nginx 等反向代理后面时置 1，登录限流才会按真实客户端 IP 计数
      # （否则所有请求都来自代理 IP，等于全局限流，攻击者可把管理员锁在门外）。
      # 仅在确认前置代理会重写 X-Real-IP / X-Forwarded-For 时才开启。
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - ./gateway-data:/app/data

    # 优雅关闭窗口：给在途请求（含长流式生成）留出收尾时间
    stop_grace_period: 15s

    healthcheck:
      # 容器内 busybox wget 探测 /health；连接失败即视为不健康
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志滚动，避免长期运行时 json-file 日志无限增长占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
