# AI Gateway —— Docker Compose 部署（仅 App 容器）
#
# 快速开始：
#   1. cp .env.example .env        # 按需修改宿主机端口 / 跨域来源
#   2. docker compose up -d --build
#   3. 浏览器打开 http://localhost:7000
#
# 首次运行：容器内会生成 data/gateway.db，管理员用户名为 admin，
#          第一次用任意密码登录后即被哈希保存（与项目原逻辑一致）。
#
# 数据持久化：命名卷 gateway-data 挂载到 /app/data，容器重建/升级不丢数据。
# 端口映射：宿主机 ${PORT:-7000} -> 容器 7000（容器内固定 7000）。
#
# 若想改用宿主机目录（便于直接备份/查看 gateway.db），把 volumes 换成：
#   - ./gateway-data:/app/data
# 并在首次启动前确保目录可写：mkdir -p gateway-data && chown -R 100:101 gateway-data
# （镜像内 app 用户的 uid:gid = 100:101）。入口脚本在容器以 root 启动时
#  会自动 chown /app/data，因此多数情况下无需手动处理。

services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped

    # init: 由 Docker 注入一个轻量 init(PID 1)，负责回收僵尸进程并把
    # SIGTERM 正确转发给入口脚本 / 网关，配合程序的优雅关闭。
    init: true

    ports:
      - "${PORT:-7000}:7000"
    environment:
      PORT: "7000"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-}"
    volumes:
      - gateway-data:/app/data

    # 优雅关闭窗口：给在途请求（含长流式生成）留出收尾时间
    stop_grace_period: 15s

    healthcheck:
      # 容器内 busybox wget 探测 /health；连接失败即视为不健康
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志滚动，避免长期运行时 json-file 日志无限增长占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
    driver: local
